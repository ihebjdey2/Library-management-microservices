<mat-card class="cardWithShadow">
    <mat-card-content class="p-24">
      <div class="d-flex w-100">
        <!-- Search Input -->
        <input type="text" placeholder="Search" [(ngModel)]="search">
        <button mat-flat-button color="accent" class="w-10" routerLink="/employee/addEmployee">Add Employee</button>
      </div>
    </mat-card-content>
  </mat-card>
  
  <mat-card class="cardWithShadow">
    <mat-card-content class="p-20">
      <div>
        <!-- Employee Table -->
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th class="table-header">Name</th>
                <th class="table-header">Department</th>
                <th class="table-header">Position</th>
                <th class="table-header">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let employee of displayedEmployees">
                <td class="table-cell">{{ employee.firstName }} {{ employee.lastName }}</td>
                <td class="table-cell">{{ employee.department }}</td>
                <td class="table-cell">{{ employee.position }}</td>
                <td class="table-cell">
                  <div>
                    <button
                      mat-stroked-button
                      class="flex-grow-1 d-flex align-items-center bg-success text-white"
                      (click)="updateEmployee(employee)"
                    >
                      Update
                    </button>
                    <button
                      mat-flat-button
                      color="warn"
                      class="flex-grow-1"
                      (click)="deleteEmployee(employee.id)"
                    >
                      Delete
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
  
  <!-- Update Section -->
  <div *ngIf="show">
    <app-employee-update [employee]="selectedEmployee" (updateEmployee)="changeTab($event)"></app-employee-update>
  </div>
